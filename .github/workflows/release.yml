name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the release (e.g. v0.1.0). Required when triggered manually."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks
        run: make ci

      - name: Package extension
        id: package
        run: |
          version="${{ steps.version.outputs.value }}"
          archive="show-pic-${version}.zip"
          (cd dist && zip -r "../${archive}" .)
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "Created ${archive} ($(du -h "${archive}" | cut -f1))"

      - name: Compute SHA-256 checksum
        run: |
          shasum -a 256 "${{ steps.package.outputs.archive }}" \
            | tee "${{ steps.package.outputs.archive }}.sha256"

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${{ steps.version.outputs.value }}"
          notes_path="release-notes.md"
          if [ ! -f CHANGELOG.md ]; then
            echo "_No CHANGELOG.md present; see auto-generated notes below._" > "${notes_path}"
          else
            awk -v target="${version}" '
              BEGIN { capture = 0 }
              /^## / {
                if (capture) { exit }
                if (index($0, "[" target "]") > 0 || index($0, " " target " ") > 0 || index($0, " " target) > 0) {
                  capture = 1
                  next
                }
              }
              capture { print }
            ' CHANGELOG.md > "${notes_path}"
            if [ ! -s "${notes_path}" ]; then
              echo "_No CHANGELOG.md section found for ${version}; see auto-generated notes below._" > "${notes_path}"
            fi
          fi
          echo "----- Release notes preview -----"
          head -60 "${notes_path}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: ${{ steps.version.outputs.value }}
          generate_release_notes: true
          append_body: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          body_path: release-notes.md
