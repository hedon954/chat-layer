<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatLayer Options</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: Canvas;
        color: CanvasText;
      }

      .sp-options {
        box-sizing: border-box;
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 24px;
      }

      form {
        display: grid;
        gap: 12px;
        margin-top: 24px;
      }

      label {
        font-weight: 650;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
        border-radius: 8px;
        font: inherit;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .checkbox-row input {
        width: auto;
      }

      button {
        width: fit-content;
        padding: 10px 14px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
      }

      .help,
      #status {
        color: color-mix(in srgb, CanvasText 70%, transparent);
      }
    </style>
  </head>
  <body>
    <main class="sp-options">
      <h1>ChatLayer Options</h1>
      <p>
        Mermaid diagrams render locally. PlantUML diagrams render through the server configured below.
      </p>
      <form id="settings-form">
        <label for="plantuml-server">PlantUML server base URL</label>
        <input
          id="plantuml-server"
          name="plantumlServerBaseUrl"
          type="url"
          placeholder="https://www.plantuml.com/plantuml"
          required
        />
        <p class="help">
          Use a local or self-hosted server for private diagrams. The diagram source is sent to this server.
        </p>
        <label class="checkbox-row" for="toc-enabled">
          <input id="toc-enabled" name="tocEnabled" type="checkbox" />
          Enable table of contents panel
        </label>
        <button type="submit">Save Settings</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/assets/options.js"></script>
  </body>
</html>
